name: Pruebas del núcleo

on:
  push:
    branches: [main, fix/android-startup]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: windows-2022
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python 3.8.10 de 64 bits
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Instalar dependencias del núcleo
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install -r requirements-core.txt
      - name: Validar sintaxis Python
        run: python -m py_compile main.py src/armador/core.py tests/test_core.py
      - name: Ejecutar pruebas
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
