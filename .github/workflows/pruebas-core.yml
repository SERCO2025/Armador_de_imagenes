name: Pruebas del núcleo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python 3.7.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.7.9"
      - name: Instalar dependencias del núcleo
        run: python -m pip install --upgrade "pip<24.1" && python -m pip install -r requirements-core.txt
      - name: Ejecutar pruebas
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
