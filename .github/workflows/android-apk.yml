name: Compilar APK de Android

on:
  push:
    branches: [main, fase1-emparejamiento, fix/android-startup]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      # pip cache guarda paquetes descargados; .buildozer conserva SDK/NDK,
      # herramientas y partes de compilaciones reutilizables.
      - name: Configurar Python de construcción
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            buildozer.spec
            requirements-core.txt
            .github/workflows/android-apk.yml
      - name: Restaurar caché de Android y Gradle
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: android-build-v3-clean-sdk-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-core.txt', '.github/workflows/android-apk.yml') }}
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - name: Instalar herramientas Android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"
      - name: Preparar ubicación del Android SDK para Buildozer
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Instalar herramientas Android
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools
      - name: Instalar y verificar Android SDK Platform 31
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          SDKMANAGER_REAL="$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager"
          SDKMANAGER_COMPAT="$SDK_ROOT/tools/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER_REAL" ]; then
            echo "::error::No se encontró sdkmanager en $SDKMANAGER_REAL"
            find "$SDK_ROOT" -maxdepth 6 -type f -name sdkmanager -print || true
            exit 1
          fi

          # Buildozer 1.5.0 todavía busca sdkmanager en tools/bin.
          # Este wrapper conserva el SDK moderno en cmdline-tools/12.0.
          mkdir -p "$SDK_ROOT/tools/bin"
          cat > "$SDKMANAGER_COMPAT" <<EOF
          #!/usr/bin/env bash
          exec "$SDKMANAGER_REAL" "\$@"
          EOF
          chmod +x "$SDKMANAGER_COMPAT"

          "$SDKMANAGER_COMPAT" --sdk_root="$SDK_ROOT" \
            "platforms;android-31" \
            "build-tools;31.0.0"

          test -d "$SDK_ROOT/platforms/android-31"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDKMANAGER_COMPAT"
          echo "Android SDK Platform 31 y compatibilidad Buildozer verificadas."
      - name: Compilar APK de depuración
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: buildozer android debug
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ArmadorDeImagenes-Android-arm64-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
