name: Compilar APK de Android

on:
  push:
    branches: [main, fase1-emparejamiento]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      # pip cache guarda paquetes descargados; .buildozer conserva SDK/NDK,
      # herramientas y partes de compilaciones reutilizables.
      - name: Configurar Python de construcción
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            buildozer.spec
            requirements-core.txt
            .github/workflows/android-apk.yml
      - name: Restaurar caché de Android y Gradle
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: android-build-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-core.txt', '.github/workflows/android-apk.yml') }}
          restore-keys: |
            android-build-v2-${{ runner.os }}-
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - name: Instalar herramientas Android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"
      - name: Compilar APK de depuración
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: buildozer android debug
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ArmadorDeImagenes-Android-arm64-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
